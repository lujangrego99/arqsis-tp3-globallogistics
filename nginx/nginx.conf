# Balanceador de carga: un único NGINX delante de las 3 réplicas del microservicio.
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;

    upstream envios {
        # Memoria compartida: todos los workers de NGINX ven el mismo estado de
        # las réplicas (turno del round robin y réplicas marcadas como caídas).
        zone envios 64k;

        # Round robin (algoritmo por defecto) entre las 3 réplicas.
        # Health check pasivo: si una réplica falla 3 veces en 10 s se la marca
        # como caída y no recibe tráfico durante 10 s; después se la vuelve a probar.
        server envios-1:3000 max_fails=3 fail_timeout=10s;
        server envios-2:3000 max_fails=3 fail_timeout=10s;
        server envios-3:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://envios;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Timeouts holgados: una réplica lenta por saturación no debe contarse como caída
            # (si no, el health check pasivo la saca del pool y la carga se cae en cascada).
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            # Qué cuenta como falla para el health check: errores de conexión,
            # timeouts y respuestas 5xx. Ante una falla se reintenta en otra réplica.
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        # Estado del propio balanceador.
        location = /lb-health {
            return 200 "OK\n";
        }
    }
}
